    <script>
  // Object to store preloaded audio
  const audioCache = {};

  // Function to play sounds
  function play(filename) {
    // If not already loaded, preload it
    if (!audioCache[filename]) {
      const audio = new Audio("/soundfx/" + filename); // adjust path to your folder
      audio.load(); // preload it
      audioCache[filename] = audio;
    }

    const sound = audioCache[filename];
    sound.currentTime = 0; // rewind to start
    sound.play();           // play instantly
  }
</script> 
    
     <h1> NerpX </h1>
    
    <center> 
<div class="button" onclick="play('correct.mp3')"> <p>Truth</p> </div>
<div class="button" onclick="play('wrong.mp3')"> <p>False</p> </div>
