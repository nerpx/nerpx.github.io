    <script>
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const audioFiles = ["wrong.mp3", "correct.mp3", "hehe.mp3", "applepay.mp3", "indian.mp3", "trombone.mp3", "dexter.mp3", "cricket.mp3", "bttb.mp3", "fart.mp3", "oiia.mp3", "explode.mp3", "punch.mp3", "intensefart.mp3", "shot.mp3", "dryfart.mp3", "slap.mp3", "smack.mp3", "Dah.mp3", "Ow.mp3", "Ow 2.mp3", "hoo.mp3", "shamone1.mp3", "shamone2.mp3"];
  const audioBuffers = {};

  // Preload all sounds
  audioFiles.forEach(file => {
    fetch("/soundfx/" + file)
      .then(response => response.arrayBuffer())
      .then(arrayBuffer => audioContext.decodeAudioData(arrayBuffer))
      .then(decodedBuffer => {
        audioBuffers[file] = decodedBuffer;
      });
  });

  // Play function — creates a new source each time
  function play(filename) {
    const buffer = audioBuffers[filename];
    if (!buffer) return; // not loaded yet

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start(0); // play immediately
  }

  // Unlock iOS audio on first tap
  let unlocked = false;
  function unlockAudio() {
    if (!unlocked) {
      audioContext.resume();
      unlocked = true;
    }
  }
  document.body.addEventListener("click", unlockAudio, { once: true });
</script>
