<body>

    <script>
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const audioFiles = ["wrong.mp3", "correct.mp3"];
  const audioBuffers = {};

  // Preload all sounds
  audioFiles.forEach(file => {
    fetch("/soundfx/" + file)
      .then(response => response.arrayBuffer())
      .then(arrayBuffer => audioContext.decodeAudioData(arrayBuffer))
      .then(decodedBuffer => {
        audioBuffers[file] = decodedBuffer;
      });
  });

  // Play function — creates a new source each time
  function play(filename) {
    const buffer = audioBuffers[filename];
    if (!buffer) return; // not loaded yet

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.connect(audioContext.destination);
    source.start(0); // play immediately
  }

  // Unlock iOS audio on first tap
  let unlocked = false;
  function unlockAudio() {
    if (!unlocked) {
      audioContext.resume();
      unlocked = true;
    }
  }
  document.body.addEventListener("click", unlockAudio, { once: true });
</script>
