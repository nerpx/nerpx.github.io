<body>

    <script>
  // Object to store preloaded audio
  const audioCache = {};
  const audioFiles = ["wrong.mp3", "correct.mp3"]; // your actual files

  // Preload all sounds
  audioFiles.forEach(f => {
    const audio = new Audio("/soundfx/" + f); // make sure this matches your folder
    audio.load();
    audioCache[f] = audio;
  });

  // Unlock iOS audio on first tap/click
  let audioUnlocked = false;
  function unlockAudio() {
    if (!audioUnlocked) {
      const context = new (window.AudioContext || window.webkitAudioContext)();
      const buffer = context.createBuffer(1, 1, 22050);
      const source = context.createBufferSource();
      source.buffer = buffer;
      source.connect(context.destination);
      source.start(0);
      audioUnlocked = true;
    }
  }
  document.body.addEventListener("click", unlockAudio, { once: true });

  // Universal play function
  function play(filename) {
    const sound = audioCache[filename];
    if (!sound) return;
    sound.currentTime = 0;
    sound.play();
  }
</script>
    
     <h1> NerpX </h1>
    
    <center> 
<div class="button" onclick="play('correct.mp3')"> <p>Truth</p> </div>
<div class="button" onclick="play('wrong.mp3')"> <p>False</p> </div>

    </center>
