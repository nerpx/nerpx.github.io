   <div class="time">  
        <h1 class="clocktext">The Current Time Is:</h1>        

<!-- Clock Display -->
<div id="clock" class="clock"></div>
<script>
  function updateClock() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2,'0');
    const seconds = String(now.getSeconds()).padStart(2,'0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12; // convert 0 to 12 for midnight
    document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
  }
  updateClock();              
  setInterval(updateClock,1000);
</script>
</div>

<script>
function goFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  }
}
</script>

<script>
  function picswitch() {
  document.getElementById("picture").innerHTML = '<img src="https://nerpx.github.io/Media/Lovebirds.jpg" width="100%" height="100%"></iframe>';
  }

  function waitscreen() {
  document.getElementById("picture").innerHTML = '<img src="YTPIBC.PNG" style="width: 100%; height: 100%;"> ';
  }

</script>



<div class="bcon">

<button onclick="this.style.display='none'; goFullscreen()"> <p>Go Fullscreen </p></button>

    <button onclick="picswitch()"> <p>Switch to birds</p></button>
    <button onclick="waitscreen()"> <p>Switch to waitscreen</p></button>
    <input type="number" id="num">

<script>

const output = document.getElementById("output");

num.addEventListener("input", function () {

});

</script>
