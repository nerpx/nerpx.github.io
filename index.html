<!DOCTYPE html>
<!-- Made With Care -->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NerpX</title>
        <link rel="stylesheet" href="style.css">
        <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
        <link rel="manifest" href="/favicons/site.webmanifest">
    </head>
    <body>
        <header><h1>NerpX</h1> <p id="phrase"></p></header>
        <main>

           <div class="sidebar smallhide" id="news">
                <h3>News</h3>
                <div class="sidebar-content">
                <p>NerpX V3.0 Is Out!!!</p>
                <br>
                <p>Rebuilt from scratch V3.0 Is sure to be both more stylish and reliable than its elder counterparts</p>
                <br>
                <img src="images/iPhone4.JPG" alt="iPhone 4">
                <p>My iPhone 4</p>
                <div class="brhalf"></div>
            </div>

            </div>
                <div class="main">
                    <h2>Welcome to NerpX!</h2>
                    <div class="brhalf"></div>

                    <div class="maincontain">

                        <div class="mainleft">
                            <button id="main" class="toggle active">Main</button>
                            <button id="news" class="newsbtn toggle">News</button>
                            <button id="about" class="toggle">About</button>
                            <button id="info" class="toggle">Profile + More</button>
                            <button id="journal" class="toggle">Journal</button>
                            <button id="subpages" class="toggle">Subpages</button>
                            <button id="contact" class="toggle">Contact & Support</button>         
                        </div>

                        <div class="mainright" id="mainright">
                            <h3> Main </h3>
                            <p>School hasnt even started and I already cant wait for thanksgiving break...</p>
                            <img src="/images/cat.gif">
                            <p>me this summer break.</p>
                        </div>

                    </div>

                </div>

                <script src="script.js" defer></script>
                
        </main>
