<!DOCTYPE HTML>
<html>
    <head>
        <title>ye</title>
    </head>

<body>
    <div class="body">

        <script>
            let locked = false;

            async function goFullscreen() {
                const el = document.documentElement;

                if (el.requestFullscreen) {
                    await el.requestFullscreen();
                } else if (el.webkitRequestFullscreen) {
                    await el.webkitRequestFullscreen();
                }
            }

            function lockFullscreen() {
                if (!locked) return;
                goFullscreen();
            }

            window.addEventListener("keydown", async () => {
                if (locked) return;
                locked = true;

                const audio = new Audio("ye.mp3");
                audio.play();

                await goFullscreen();

                document.addEventListener("fullscreenchange", lockFullscreen);
            });
        </script>

        <style>
        * {
            margin: 0;
            padding: 0;
            object-fit: fill;
            width: 100%;
            height: 100%;
            background-color: black;
        }
        </style>

        <img src="ye.avif" class="ye">

    </div>
</body>
</html>
