<!DOCTYPE HTML>
<html>
    <head>
        <title>ye</title>
    </head>

<body>
    <div class="body">

        <script>
            const audio = new Audio('ye.mp3');
            audio.preload = "auto";
        </script>

        <script defer>
            window.onload = function() {
                // removed autoplay (blocked by browsers)
            };
        </script>

        <style>
        * {
            margin: 0;
            padding: 0;
            object-fit: fill;
            width: 100%;
            height: 100%;
            background-color: black;
        }
        </style>

        <img src="ye.avif" class="ye">

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const img = document.querySelector(".ye");

                img.addEventListener("click", () => {
                    audio.currentTime = 0;
                    audio.play();
                });
            });
        </script>

    </div>
</body>
</html>
