<!DOCTYPE HTML>
<!-- FINALPROJECT ALPHA 5.0 -->
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Final Project</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="nt.css" id="nt">
    </head>
    <body> <script src="launch.js" defer></script>
        <script src="dos.js" defer></script>
        <script src="os.js" defer></script>
        <div class="body" id="body">
<div class="nthomepage">
    <div class="mainboxnt" id="mainboxnt">

        <div class="foldercontainer">
            <img src="folder.png" class="foldericon"
                 onmouseenter="this.src='folderselected.png'" 
     onmouseleave="this.src='folder.png'"
     onclick="guessWho()">
            <p class="foldertext">Guess Who?</p>
        </div>

        <div class="foldercontainer" onclick="cna()">
            <img src="folder.png" class="foldericon"
                 onmouseenter="this.src='folderselected.png'" 
     onmouseleave="this.src='folder.png'" >
            <p class="foldertext">C&A</p>
        </div>

        <div class="guesswho hidden" id="guesswho">
            <div class="topbar">
                <p class="topbartext">Guess Who?</p>
                <div class="windowbuttonscontainer">
                <button class="minimize" onclick="guessWhoHide();"><p>&minus;</p></button>
                <button class="maximize" onclick="guessWhoFullScreen();"><p>&#x25AB;</p></button>
             <button class="close" onclick="closeWindow()"><p>&times;</p></button>
             </div>
            </div>
                <div class="ghwcontent">
                    <iframe src="guesswho.html" class="ghwiframe"></iframe>
                </div>
            </div>

            <div class="windowsmenu hidden" id="windowsmenu">
                <div class="menugradient"><p class="ntlogo2">Workstation</p><h1 class="ntlogo">Windows NT</h1></div>
                <div class="startbuttoncontainer">
                    <div class="windowsmenuitem programs"><img src="NT4/programs.PNG" class="startmenuicons"><u>P</u>rograms</div>
                    <div class="windowsmenuitem documents"><img src="NT4/documents.PNG" class="startmenuicons"><u>D</u>ocuments</div>
                    <div class="windowsmenuitem settings" onclick="cookiereset();"><img src="NT4/settings.PNG" class="startmenuicons"><u>S</u>ettings</div>
                    <div class="windowsmenuitem find"><img src="NT4/programs.PNG" class="startmenuicons"><u>F</u>ind</div>
                    <div class="windowsmenuitem help"><img src="NT4/help.PNG" class="startmenuicons" onclick="showCredits()"><u>C</u>redits</div>
                    <div class="windowsmenuitem run" onclick="refresh();"><img src="NT4/runs.PNG" class="startmenuicons"><u>R</u>un....</div>
                    <div class="windowsmenuitem last" onclick="shutdown()"><img src="shutdownlogo.png" class="shutdownlogo">Sh<u>u</u>t Down...</div>
                </div>
            </div>
    </div>

    <div class="error hidden" id="error">
         <div class="errorbar"><p class="t1">Caine.ai coreaiprocess</p><button class="errorclose" onclick="closeError()"><p>&times;</p></button></div>
         <div class="errorcontent">
                 <img src="crash.png" class="errorimage">
                 <p class="errortext">FATAL EXCEPTION OCCURED<br>Out of memory, terminating core ai proccesses <b>ERROR: 0XCEE</b></p>
                </div>
                    <button class="errorbutton" onclick="closeError()">OK</button>
    </div>
 
            <div class="startbar">
        <div class="startbutton" role="button" tabindex="0"  onclick="startbutton()" >
                <img src="logo.png" class="startimage">
    </div>
    <div class="breaker"></div>
    <div class="hidden" id="guesswhohw">
            <div class="windowsopen" onclick="guessWhoButtonClick()"><p class="windowsopenp">Guess Who?</p></div>
        </div>
    <div class="clock">
      <p class="clocktext" id="clock"></p>      
        </div>
    </div>
    
</div>

</body>

</html>
